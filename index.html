<title>Boas Mãos Mecânica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EAE7;--g:#14323A;--g2:#1d4550;--g3:#0d2328;--g4:#2a5a66;--y:#F2B705;--y2:#dba604;--y3:#fff4cc;
  --ink:#14323A;--mut:#5b696c;--line:#d5d9d4;--line2:#e6e9e5;--card:#fff;--soft:#f3f4f2;--soft2:#eef0ed;
  --red:#C62828;--redbg:#fdeceb;--ok:#2E7D32;--okbg:#e6f4e7;--blue:#1565C0;--bluebg:#e5effb;
  --r:14px;--r2:10px;
  --sh:0 1px 2px rgba(20,50,58,.06),0 2px 8px rgba(20,50,58,.05);
  --sh2:0 2px 4px rgba(20,50,58,.06),0 10px 28px rgba(20,50,58,.12);
  --sh3:0 24px 64px rgba(13,35,40,.32);
  --ring:0 0 0 3px rgba(242,183,5,.55);
  --t:.16s cubic-bezier(.3,.7,.4,1)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--y);color:var(--g)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h{font-family:"Barlow Condensed",Barlow,sans-serif;text-transform:uppercase;letter-spacing:.03em;font-weight:800;margin:0;line-height:1.1}
h2.h{font-size:25px;margin-bottom:12px}
.md h2.h{font-size:23px;margin-bottom:10px}
h3.h{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
h3.h svg.i{width:20px;height:20px}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r2);padding:8px 14px;font-weight:700;background:#fff;color:var(--g);border:1.5px solid var(--line);min-height:40px;transition:transform .08s,background var(--t),border-color var(--t),box-shadow var(--t),color var(--t);text-decoration:none;white-space:nowrap;line-height:1.1;box-shadow:0 1px 1px rgba(20,50,58,.04)}
.btn:hover{border-color:var(--g);box-shadow:0 2px 8px rgba(20,50,58,.1)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:none}
.btn.y{background:var(--y);border-color:var(--y);color:var(--g);box-shadow:0 2px 0 var(--y2),0 4px 14px rgba(242,183,5,.25)}
.btn.y:hover{background:#f7c11f;border-color:#f7c11f}
.btn.y:focus-visible{outline-color:var(--g)}
.btn.g{background:var(--g);border-color:var(--g);color:#fff}
.btn.g:hover{background:var(--g2);border-color:var(--g2)}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.r:hover{background:#ad1f1f;border-color:#ad1f1f}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#256a29;border-color:#256a29}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:rgba(20,50,58,.07);border-color:transparent}
.btn.s{min-height:32px;padding:5px 10px;font-size:14px;border-radius:8px;gap:6px}
.btn.s svg.i{width:17px;height:17px}
.btn.lg{min-height:46px;font-size:17px;padding:10px 20px}
.btn.xl{min-height:58px;font-size:24px;width:100%;font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.04em;border-radius:16px;box-shadow:0 3px 0 var(--y2),0 8px 22px rgba(242,183,5,.32)}
.btn.xl small{font-size:14px;opacity:.65;font-family:Barlow;text-transform:none;letter-spacing:0;font-weight:700}
.btn.w{width:100%}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.y:disabled{background:#e7d9a6;border-color:#e7d9a6;opacity:.7}
.input{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:var(--r2);background:#fff;min-height:42px;transition:border-color var(--t),box-shadow var(--t)}
.input:hover{border-color:#b9c0bb}
.input:focus,.input:focus-visible{outline:none;border-color:var(--g);box-shadow:var(--ring)}
.input::placeholder{color:#8a9597}
.input.big{font-size:26px;font-weight:700;min-height:54px;font-variant-numeric:tabular-nums}
select.input{cursor:pointer}
textarea.input{min-height:76px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:11px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:10px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--g)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:14px 16px;border:1px solid rgba(20,50,58,.06)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft2);color:var(--g);white-space:nowrap;line-height:1.4}
.pill.y{background:var(--y3);color:#6e5200}
.pill.r{background:var(--redbg);color:var(--red)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.b{background:var(--bluebg);color:var(--blue)}
.pill.g{background:var(--g);color:#fff}
.st-ok{background:var(--okbg);color:var(--ok)}
.st-x{background:#eceeeb;color:#7c8587;text-decoration:line-through}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap;min-height:36px;transition:background var(--t),border-color var(--t),color var(--t)}
.chip:hover{border-color:var(--g)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip b{opacity:.65;margin-left:4px}
.empty{text-align:center;padding:24px 12px;color:var(--mut)}
.empty .eico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px;background:var(--y3);color:var(--g)}
.empty .eico svg.i{width:30px;height:30px}
.empty .et{display:block;font-family:"Barlow Condensed";font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.03em;color:var(--g);margin-bottom:4px}
.empty .ed{display:block;max-width:420px;margin:0 auto;font-size:15px}
.empty .ea{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.empty.box{background:#fff;border-radius:12px;border:1.5px dashed #c9cfca;padding:30px 16px}
.empty.sm-e{padding:22px 8px}
.empty.sm-e .eico{width:52px;height:52px;border-radius:14px}
.empty.sm-e .eico svg.i{width:24px;height:24px}
.empty.sm-e .et{font-size:18px}
.empty.sm-e .ed{font-size:14px}
.tbl-w{overflow:auto;border-radius:var(--r);background:#fff;box-shadow:var(--sh);border:1px solid rgba(20,50,58,.06)}
@media(min-width:900px){#adm .tbl-w{max-height:calc(100vh - 180px)}}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--mut);padding:9px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:#f6f7f5;position:sticky;top:0;z-index:2}
table.t td{padding:7px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr{transition:background var(--t)}
table.t tbody tr:hover td{background:#fafbf9}
table.t tr.low td{background:#fff6f5}
table.t tr.low td:first-child{box-shadow:inset 4px 0 0 var(--red)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fffbea}
table.t td .btn.s{margin-left:4px}
.r-al{text-align:right!important}
.el{max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg.lg{display:block;width:100%;height:100%}
.lg-a{fill:var(--g)}.lg-b{fill:var(--y)}
.rlogo{display:block;width:40px;height:40px;margin:0 auto 4px}
.rlogo .lg-a{fill:#111}.rlogo .lg-b{fill:#fffef8}
#print .rlogo .lg-b{fill:#fff}
/* ===== barra superior única (igual em todas as telas) ===== */
.tb{background:linear-gradient(180deg,var(--g) 0%,#112b32 100%);color:#fff;box-shadow:0 2px 10px rgba(13,35,40,.25);position:sticky;top:0;z-index:20;flex:none}
.tb-in{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:56px}
.tb-art{flex:none;display:block;width:60px;height:44px;padding:0;border:2px solid rgba(255,255,255,.92);border-radius:10px;overflow:hidden;background:var(--g3);cursor:zoom-in;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform var(--t)}
.tb-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 7%}
.tb-art:hover{transform:scale(1.06)}
.tb-art:focus-visible{outline-offset:1px}
.tb .nm{font-family:"Barlow Condensed";font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;margin-right:4px;line-height:1.1}
.tnav{display:flex;gap:2px;min-width:0}
.tnav a{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;border-radius:9px;color:#c3d2d4;text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap;transition:background var(--t),color var(--t)}
.tnav a svg.i{width:18px;height:18px;display:none}
.tnav a:hover{color:#fff;background:rgba(255,255,255,.09)}
.tnav a.on{background:var(--y);color:var(--g)}
.tnav a .cbadge{background:var(--red);color:#fff;font-size:10.5px;min-width:18px;height:18px;padding:0 5px}
.tb-ic{flex:none;width:40px;height:40px;border-radius:9px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;padding:0;transition:border-color var(--t),background var(--t)}
.tb-ic:hover{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.12)}
.tb-ic svg.i{width:19px;height:19px}
.op{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:9px;height:40px;padding:0 2px 0 8px;color:#cfe0e2;transition:border-color var(--t);flex:none}
.op:hover,.op:focus-within{border-color:rgba(255,255,255,.6)}
.op svg.i{width:17px;height:17px}
.tb select{background:transparent;color:#fff;border:0;height:36px;padding:0 4px;font-weight:700;cursor:pointer;max-width:120px;font-size:14px}
.tb select:focus-visible{outline:2px solid var(--y);outline-offset:0;border-radius:6px}
.tb select option{color:var(--g)}
.cx{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;padding:0 12px;height:40px;border-radius:9px;border:1.5px solid transparent;transition:filter var(--t),border-color var(--t);min-width:0;flex:0 1 auto;max-width:300px}
.cx>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cx:hover{filter:brightness(1.1);border-color:rgba(255,255,255,.4)}
.cx.on{background:rgba(46,125,50,.28);color:#c9f2d5;border-color:rgba(130,210,150,.35)}
.cx.on .dot{background:#5fd27a;box-shadow:0 0 0 3px rgba(95,210,122,.25)}
.cx.on.old{background:var(--y);color:var(--g);border-color:var(--y2)}
.cx.on.old .dot{background:var(--red);box-shadow:0 0 0 3px rgba(198,40,40,.25)}
.cx.off{background:var(--red);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(198,40,40,.35)}}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:#b9d0d3;white-space:nowrap;flex:none}
.net i{width:8px;height:8px;border-radius:50%;background:#5fd27a}
.net.off{background:var(--y);color:var(--g)}
.net.off i{background:var(--red)}
@media(min-width:1440px){.tnav a svg.i{display:block}}
@media(max-width:1180px){.net:not(.off) span{display:none}.net:not(.off){padding:6px}.tb .nm{max-width:130px}}
@media(max-width:1060px){.tb .nm{display:none}.tnav a{padding:0 10px}}
@media(max-width:899px){
  .tb-in{flex-wrap:wrap;row-gap:6px;padding:6px 10px}
  .tb .nm{display:block;max-width:none;flex:1;min-width:0}
  .tnav{order:20;width:100%;gap:2px}
  .tnav a{flex:1;padding:0 4px;height:38px;font-size:14px}
  .tnav a .cbadge{position:absolute;top:-5px;right:-3px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
}
@media(max-width:600px){
  .tb-art{width:50px;height:40px}
  .tb .nm{display:none}
  .tb-in>.sp{display:none}
  .tb-help{display:none!important}
  .cx{flex:1 1 0;justify-content:center;padding:0 8px;font-size:13px;max-width:none}
  .tb select{max-width:78px}
  .net:not(.off){display:none}
  .net.off{order:19;width:100%;justify-content:center}
  .tnav a{font-size:13.5px}
}
.md.artmd{max-width:min(620px,calc((94vh - 40px)*2/3 + 40px));padding:20px;background:var(--g)}
.md.artmd img{display:block;width:100%;height:auto;border-radius:12px}
.md.artmd .mx{background:rgba(255,255,255,.92)}
kbd{display:inline-block;font-family:Barlow,sans-serif;font-size:11px;font-weight:800;line-height:1;padding:3px 5px;border-radius:4px;background:rgba(20,50,58,.1);color:inherit;opacity:.8;vertical-align:1px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;font-size:15px;margin:0}
.keys dt{text-align:right}
.keys dt kbd{font-size:13px;padding:4px 7px;background:var(--y);color:var(--g);opacity:1}
.keys dd{margin:0}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--g);flex:none}
.ico svg.i{width:24px;height:24px}

/* toast & modal */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px));pointer-events:none}
@media(min-width:700px){#toasts{top:auto;bottom:52px;left:16px;transform:none;width:340px;flex-direction:column-reverse}}
.toast{background:var(--g);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(13,35,40,.3);animation:tin .22s ease-out;display:flex;gap:10px;align-items:center;pointer-events:auto;border-left:5px solid var(--y)}
.toast.err{background:var(--red);border-left-color:#7f1010}
.toast.ok{background:var(--ok);border-left-color:#1b5e20}
.toast.y{background:var(--y);color:var(--g);border-left-color:var(--g)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.ov{position:fixed;inset:0;background:rgba(13,35,40,.58);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fin .15s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
@keyframes fin{from{opacity:0}}
.md{background:#fff;width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px 16px;position:relative;outline:none;box-shadow:var(--sh3);animation:mup .2s cubic-bezier(.2,.8,.3,1);overscroll-behavior:contain}
@keyframes mup{from{transform:translateY(16px);opacity:.6}}
.md.wide{max-width:920px}
.md.pay{max-width:620px}
.md>h2.h:first-of-type{padding-right:44px}
@media(min-width:700px){.ov{align-items:center;padding:16px}.md{border-radius:18px;padding:22px 24px}}
.mx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);font-size:24px;line-height:1;color:var(--g);transition:background var(--t),transform var(--t);z-index:3}
.mx:hover{background:var(--soft2);transform:rotate(90deg)}
.md .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
.md p{margin:0 0 10px}

/* comuns */
.cbadge{background:var(--y);color:var(--g);border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;font-weight:800;line-height:1}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.qty button{border:0;background:var(--soft);width:36px;height:36px;font-size:19px;font-weight:800;color:var(--g);transition:background var(--t)}
.qty button:hover{background:var(--y3)}
.qty span{min-width:38px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}

/* ---------- chaves do localStorage ---------- */
const KEY='bancada_db_v1', PCART='bancada_pdv_cart', OPKEY='bancada_operador';

/* ---------- utilitários ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const r2=v=>Math.round((+v||0)*100)/100;
const fmt=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pad=(n,l=2)=>String(n).padStart(l,'0');
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dkey(Date.now());
const fdt=ts=>{const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const fd=ts=>{const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fh=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fdk=k=>{const [y,m,d]=k.split('-');return d+'/'+m+'/'+y};
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const parseMoney=s=>{s=String(s||'').trim();if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return r2(parseFloat(s)||0)};
const m2s=v=>(+v||0).toFixed(2).replace('.',',');
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Não foi possível salvar no navegador','err')}};
const onlyDigits=s=>String(s||'').replace(/\D/g,'');
/* chave Pix no formato que o app do banco aceita: CPF/CNPJ só dígitos, celular +55DDD…,
   e-mail minúsculo; chave aleatória e outros textos ficam como digitados */
const cpfOk=d=>{if(!/^\d{11}$/.test(d)||/^(\d)\1+$/.test(d))return false;const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=(+d[i])*(n+1-i);return (s*10%11)%10};return dv(9)==+d[9]&&dv(10)==+d[10]};
function normPixKey(k){
 k=String(k||'').trim();if(!k)return '';
 if(k.includes('@'))return k.replace(/\s/g,'').toLowerCase();
 if(!/^[\d\s().\-\/+]+$/.test(k))return k;
 const d=onlyDigits(k);
 if(k.startsWith('+'))return '+'+d;
 if(d.length===14)return d;
 if(d.length===11&&!/[()\s]/.test(k)&&cpfOk(d))return d;
 if(d.length===10||d.length===11)return '+55'+d;
 if((d.length===12||d.length===13)&&d.startsWith('55'))return '+'+d;
 return d;
}

/* ---------- EAN-13 ---------- */
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return (10-s%10)%10}
const mkEan=d12=>d12+eanCheck(d12);
const isEan=c=>/^\d{13}$/.test(c)&&eanCheck(c.slice(0,12))==+c[12];
function eanSVG(code){
 if(!isEan(code))return `<div class="sm" style="font-family:monospace;padding:14px 0">${esc(code)}</div>`;
 const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
 const R=L.map(s=>s.replace(/./g,c=>c==='0'?'1':'0')), G=R.map(s=>s.split('').reverse().join(''));
 const P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
 const d=code.split('').map(Number);let bits='101',guard=[[0,3]];
 for(let i=1;i<=6;i++)bits+=(P[d[0]][i-1]==='L'?L:G)[d[i]];
 guard.push([bits.length,5]);bits+='01010';
 for(let i=7;i<=12;i++)bits+=R[d[i]];
 guard.push([bits.length,3]);bits+='101';
 const isG=i=>guard.some(([s,l])=>i>=s&&i<s+l);
 const w=2,x0=14;let rects='';
 for(let i=0;i<bits.length;i++)if(bits[i]==='1')rects+=`<rect x="${x0+i*w}" y="2" width="${w}" height="${isG(i)?62:54}"/>`;
 const W=x0*2+bits.length*w;
 return `<svg viewBox="0 0 ${W} 76" xmlns="http://www.w3.org/2000/svg" style="background:#fff">${rects}<g font-family="monospace" font-size="12" text-anchor="middle"><text x="7" y="72">${d[0]}</text><text x="${x0+3*w+21*w}" y="72">${code.slice(1,7)}</text><text x="${x0+50*w+21*w}" y="72">${code.slice(7)}</text></g></svg>`;
}

 ['movements','orders','payments','cash','nfs'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
 db.seq=Math.max(0,+db.seq||0);
 db.settings=Object.assign({},DEF_SETTINGS,db.settings||{});
 if(!Array.isArray(db.settings.users)||!db.settings.users.length)db.settings.users=['Balcão'];
 db.products.forEach(p=>{p.stock=+p.stock||0;p.min=+p.min||0;p.price=+p.price||0;p.cost=+p.cost||0});
 db.orders.forEach(o=>{o.customer=o.customer||{};o.items=o.items||[]});
 return db;
}

/* ---------- modais ----------
   modal(html,{wide,cls,onClose,onEnter,onKey,scanThrough})
   - onEnter: ação do Enter (salvar/confirmar), chamada UMA vez pelo teclado global.
     Não dispara com foco em botão/link/textarea (o navegador já ativa o próprio elemento).
   - onKey(e): atalhos próprios do modal; devolve true quando tratou a tecla.
   - scanThrough: digitar/bipar com o modal aberto fecha-o e manda o texto para a busca (recibo). */
const modals=[];
const topModal=()=>modals[modals.length-1];
function modalFocus(el){const a=el.querySelector('[autofocus]');(a||el.querySelector('.md')).focus()}
function modal(html,{wide,onClose,cls,onEnter,onKey,scanThrough}={}){
 const el=document.createElement('div');el.className='ov';
 el.innerHTML=`<div class="md ${wide?'wide':''} ${cls||''}" tabindex="-1" role="dialog" aria-modal="true"><button class="mx" aria-label="Fechar">×</button>${html}</div>`;
 el.querySelector('.mx').onclick=()=>closeModal(el);
 el.addEventListener('mousedown',e=>{if(e.target===el)closeModal(el)});
 document.body.appendChild(el);modals.push({el,onClose,onEnter,onKey,scanThrough});
 modalFocus(el);   /* foco já dentro do modal: teclas não vazam para a tela de trás */
 setTimeout(()=>{const t=topModal();if(t&&t.el===el&&!el.contains(document.activeElement))modalFocus(el)},40);
 return el;
}
function closeModal(el){
 if(!el)el=modals.length?topModal().el:null;
 const i=modals.findIndex(m=>m.el===el);if(i<0)return;
 const m=modals.splice(i,1)[0];m.el.remove();m.onClose&&m.onClose();
 if(modals.length){const t=topModal().el;if(!t.contains(document.activeElement))t.querySelector('.md').focus();return}
 if(staleView){staleView=false;refresh()}
 if(MODE==='pdv')focusSearch();
}
function confirmBox(msg,okLabel='Confirmar',cls='y'){return new Promise(res=>{
 let done=false;
 const yes=()=>{if(done)return;done=true;closeModal(el);res(true)};
 const el=modal(`<h2 class="h">Confirmar</h2><p>${msg}</p><div class="foot"><button class="btn" data-b>Voltar</button><button class="btn ${cls}" data-y autofocus>${okLabel}</button></div>`,{onClose:()=>{if(!done)res(false)},onEnter:yes});
 el.querySelector('[data-b]').onclick=()=>closeModal(el);el.querySelector('[data-y]').onclick=yes;
})}

/* ---------- pagamento (PDV) ---------- */
/* Teclas: 1–4 trocam a forma quando o foco não está num campo; Alt+1…4 sempre;
   ← → trocam fora de campos de texto (inclusive no campo de valor recebido); Enter confirma; Esc fecha. */
function payModal(total,{title='Pagamento',onPay}){
 let m='pix',inp=null,done=false;
 const ms=METHODS,n=ms.length;
 const el=modal(`<h2 class="h">${title}</h2><div class="paytot"><span>Total a pagar</span><b>${fmt(total)}</b></div>
  <div class="paym">${ms.map((x,i)=>`<button class="pm" data-m="${x.k}"><span class="k">${i+1}</span>${I[x.i]}<b>${x.l}</b></button>`).join('')}</div>
  <p class="mut sm paykeys" style="margin:-2px 0 10px">Trocar: <b>1</b>–<b>${n}</b> ou <b>← →</b> · <b>Alt+1…${n}</b> dentro dos campos · <b>Enter</b> confirma · <b>Esc</b> fecha</p>
  <div class="pdet"></div><button class="btn y xl" data-ok>Confirmar <small>(Enter)</small></button>`,{cls:'pay',onEnter:()=>confirmPay(),onKey:e=>payKey(e)});
 const det=$('.pdet',el),ok=$('[data-ok]',el);
 const anyField=t=>t.tagName==='INPUT'||t.tagName==='TEXTAREA';
 const textField=t=>t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.getAttribute('inputmode')!=='decimal');
 function payKey(e){
  const t=e.target;if(e.ctrlKey||e.metaKey||e.shiftKey)return false;
  const d=/^(?:Digit|Numpad)([1-9])$/.exec(e.code||'');let k=d?+d[1]:0;
  if(!k&&/^[1-9]$/.test(e.key))k=+e.key;
  if(k&&(e.altKey||!anyField(t))){if(ms[k-1])sel(ms[k-1].k);return true}
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!e.altKey&&!textField(t)&&t.tagName!=='SELECT'){
   const i=ms.findIndex(x=>x.k===m);sel(ms[(i+(e.key==='ArrowRight'?1:-1)+n)%n].k);return true}
  return false;
 }
 const calc=()=>{if(!inp)return;const r=parseMoney(inp.value),t=r2(r-total),tb=$('#troco',el);tb.parentElement.classList.toggle('neg',t<0);tb.previousElementSibling.textContent=t<0?'Falta':'Troco';tb.textContent=fmt(Math.abs(t));ok.disabled=t<0};
 function sel(k){
  m=k;$$('.pm',el).forEach(b=>b.classList.toggle('on',b.dataset.m===k));draw();
  /* foco no 1º campo da forma escolhida; senão no próprio modal (Enter e atalhos continuam valendo) */
  const f=$('.pdet input',el);if(f)f.focus();else el.querySelector('.md').focus();
 }
 function draw(){
  ok.disabled=false;inp=null;
  if(m==='dinheiro'){
   det.innerHTML=`<label class="f">Valor recebido</label><input class="input big num" id="recv" inputmode="decimal" placeholder="0,00">
   <div class="notes">${[0,10,20,50,100,200].map(v=>`<button class="btn s" data-v="${v}">${v?'R$ '+v:'Valor exato'}</button>`).join('')}</div>
   <div class="troco"><span>Troco</span><b id="troco">R$ 0,00</b></div>`;
   inp=$('#recv',det);inp.oninput=calc;
   $$('[data-v]',det).forEach(b=>b.onclick=()=>{inp.value=m2s(+b.dataset.v||total);calc();inp.focus()});
   calc();
  }else if(m==='credito'){
   det.innerHTML=`<label class="f">Parcelas</label><select class="input" id="parc">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}x de ${fmt(total/n)}${n===1?' (à vista)':''}</option>`).join('')}</select><p class="mut sm">Passe o cartão na maquininha e confirme aqui após aprovado.</p>`;
  }else if(m==='debito'){
   det.innerHTML=`<p class="mut">Passe o cartão de débito na maquininha e confirme após aprovado.</p>`;
  }else if(m==='pix'){
   const st=DB.settings;
   det.innerHTML=st.pix?`<div class="pixbox"><div class="pixqr">${pixQRSvg(pixPayload(st.pix,st.pixName,st.pixCity,total))}</div><div><b>${I.pix} Escaneie com o app do banco</b><span class="mut sm">Valor já preenchido</span><span class="pixv">${fmt(total)}</span><span class="pixk">Chave: ${esc(st.pix)}</span><p class="mut sm" style="margin:10px 0 0">Confira o recebimento no app do banco antes de confirmar.</p></div></div>`
    :`<div class="card" style="background:var(--y3);border:1.5px dashed #e0c25a;box-shadow:none;margin-bottom:14px"><b>${I.warn} Chave Pix não cadastrada.</b><br><span class="mut sm">Cadastre em ⚙ Configurações (canto superior direito) para gerar o QR Code automaticamente. Você ainda pode receber o Pix e confirmar aqui.</span></div>`;
  }
 }
 function confirmPay(){
  if(done)return;
  const info={method:m,total};
  if(m==='dinheiro'){info.received=parseMoney(inp.value);info.change=r2(info.received-total);if(info.change<0){beep(false);inp.focus();return toast(info.received?'Valor recebido menor que o total':'Informe o valor recebido','err')}}
  if(m==='credito')info.installments=+$('#parc',el).value;
  done=true;closeModal(el);onPay(info);
 }
 ok.onclick=confirmPay;
 $$('.pm',el).forEach(b=>b.onclick=()=>sel(b.dataset.m));
 sel('pix');
}

/* ---------- Pix: BR Code (padrão EMV do Banco Central) ---------- */
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?(c<<1)^0x1021:c<<1;c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(key,name,city,amount){
 const f=(id,v)=>id+pad(v.length)+v,clean=(v,n)=>norm(v||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,n);
 const p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',String(key).trim()))+f('52','0000')+f('53','986')+(amount>0?f('54',amount.toFixed(2)):'')+f('58','BR')+f('59',clean(name,25)||'LOJA')+f('60',clean(city,15)||'BRASIL')+f('62',f('05','***'))+'6304';
 return p+crc16(p);
}
function pixQRSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return '<p class="mut sm">Não foi possível gerar o QR Code.</p>'}}

const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
function camErrMsg(e){
 const n=e&&e.name;
 if(n==='NotAllowedError'||n==='SecurityError')return 'Permissão da câmera negada. Libere a câmera no navegador (ícone ao lado do endereço) ou use o leitor USB / digite o código.';
 if(n==='NotFoundError'||n==='OverconstrainedError'||n==='DevicesNotFoundError')return 'Nenhuma câmera encontrada neste aparelho. Use o leitor USB ou digite o código abaixo.';
 if(n==='NotReadableError'||n==='TrackStartError'||n==='AbortError')return 'A câmera está em uso por outro programa. Feche-o e tente de novo, ou use o leitor USB.';
 return 'Não foi possível abrir a câmera'+(n?` (${n})`:'')+'. Use o leitor USB ou digite o código abaixo.';
}
function openScanner({title='Escanear código',continuous=false,onCode}){
 let stream,stopped=false,reader,last='',lastT=0;
 const stop=()=>{stopped=true;if(stream)stream.getTracks().forEach(t=>t.stop());if(reader)try{reader.reset()}catch(e){}};
 const el=modal(`<h2 class="h">${title}</h2><div class="cam"><video playsinline muted autoplay></video><div class="aim"></div></div>
  <p class="mut sm" id="camst" style="margin:10px 0">Iniciando câmera…</p>
  <div class="row"><input class="input" id="man" placeholder="ou digite o código e Enter" style="flex:1"><button class="btn g" id="manok">OK</button></div>
  ${continuous?'<p class="mut sm">Modo contínuo: cada leitura entra no carrinho. Feche quando terminar (Esc).</p>':''}`,{onClose:stop});
 const video=$('video',el),st=$('#camst',el),man=$('#man',el);
 const fail=msg=>{if(stopped)return;st.innerHTML=`<b style="color:var(--red)">${I.warn} ${esc(msg)}</b>`;el.querySelector('.cam').hidden=true;man.focus()};
 const hit=code=>{code=String(code).trim();const t=Date.now();if(!code||(code===last&&t-lastT<1800))return;last=code;lastT=t;onCode(code);if(!continuous)closeModal(el);else st.innerHTML=`Último lido: <b>${esc(code)}</b>`};
 $('#manok',el).onclick=()=>{if(man.value.trim()){hit(man.value);man.value=''}man.focus()};
 man.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();$('#manok',el).click()}};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return fail('Câmera indisponível neste navegador (é preciso abrir o sistema por HTTPS ou localhost). Use o leitor USB ou digite o código abaixo.'),el;
 (async()=>{
  /* 1º pede a câmera: sem câmera/permissão a mensagem aparece na hora, sem baixar nada */
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return fail(camErrMsg(e))}
  if(stopped)return stop();
  video.srcObject=stream;try{await video.play()}catch(e){}
  const cb=res=>{if(res&&!stopped)hit(res.getText())};
  try{
   if('BarcodeDetector' in window){
    let formats=['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code'];
    try{const sup=await BarcodeDetector.getSupportedFormats();formats=formats.filter(f=>sup.includes(f))}catch(e){}
    const det=new BarcodeDetector({formats});
    st.textContent='Aponte para o código de barras ou QR Code';
    const loop=async()=>{if(stopped)return;try{const r=await det.detect(video);if(r.length)hit(r[0].rawValue)}catch(e){}setTimeout(loop,120)};loop();
   }else{
    st.textContent='Carregando leitor…';
    try{if(!window.ZXing)await loadScript(ZXING_URL)}catch(e){return fail('Sem internet para carregar o leitor da câmera. Use o leitor USB ou digite o código abaixo.')}
    if(stopped)return;
    reader=new ZXing.BrowserMultiFormatReader();
    st.textContent='Aponte para o código de barras ou QR Code';
    if(typeof reader.decodeFromStream==='function')await reader.decodeFromStream(stream,video,cb);
    else{stream.getTracks().forEach(t=>t.stop());stream=null;await reader.decodeFromVideoDevice(undefined,video,cb)}
   }
  }catch(e){fail(camErrMsg(e))}
 })();
 return el;
}

 c.items=c.items.filter(i=>i&&i.pid&&+i.qty>=1).map(i=>({pid:i.pid,qty:Math.floor(+i.qty),disc:Math.max(0,+i.disc||0)}));
 c.disc=c.disc&&(c.disc.type==='%'||c.disc.type==='R$')?{type:c.disc.type,v:Math.max(0,+c.disc.v||0)}:{type:'R$',v:0};

function pdvTotals(){
 let sub=0,ld=0,n=0;pcart.items=pcart.items.filter(i=>prod(i.pid));
 pcart.items.forEach(i=>{const p=prod(i.pid),g=p.price*i.qty;sub+=g;ld+=Math.min(i.disc||0,g);n+=i.qty});
 sub=r2(sub);ld=r2(ld);

}

function finalizeSale(pay){
 let err=null;const user=operator();
 const o=tx(db=>{
  const cash=db.cash.find(c=>c.status==='aberto');if(!cash){err='Caixa fechado — abra o caixa para vender';return null}
  if(!pcart.items.length){err='A venda está vazia';return null}
  for(const i of pcart.items){const p=prod2(db,i.pid);if(!p){err='Um produto da venda foi removido do cadastro';return null}
   if(!(p.price>0)){err=`${esc(p.name)} está sem preço`;return null}
   if(!p.service&&p.stock<i.qty){err=`Estoque mudou: só ${p.stock} un de ${esc(p.name)}`;return null}}
  const t=pdvTotals();   /* recalculado com os preços do estado mais novo (tx já recarregou o DB) */
  if(Math.abs(t.total-pay.total)>0.004){err=`O total mudou para ${fmt(t.total)} (preço alterado em outra aba). Confira e finalize de novo.`;return null}
  const items=pcart.items.map(i=>{const p=prod2(db,i.pid);return{pid:p.id,code:p.code,name:p.name,qty:i.qty,price:p.price,cost:p.cost||0,disc:r2(Math.min(i.disc||0,p.price*i.qty)),service:!!p.service}});
  const o={id:uid(),num:nextNum(db),ts:Date.now(),channel:'PDV',items,subtotal:t.sub,discount:t.disc,total:t.total,method:pay.method,paid:true,status:'entregue',seller:user,cashId:cash.id,customer:pay.customer||{}};
  if(o.paid)o.paidTs=o.ts;if(pay.method==='dinheiro'){o.received=pay.received;o.change=pay.change}if(pay.installments)o.installments=pay.installments;
  items.forEach(i=>mov(db,i.pid,-i.qty,'venda',o.num,'PDV',user));
  db.orders.push(o);
  if(o.paid)db.payments.push({id:uid(),ts:o.ts,orderId:o.id,num:o.num,method:o.method,amount:o.total,cashId:cash.id,kind:'venda',user});
  return o;
 });
 if(!o){beep(false);toast(err,'err');refresh();return}
 pcart=emptyCart();savePC();clearPS();pdvGrid();pdvCart();pdvHeader();
 showReceipt(o,'Venda finalizada');
}

function cashReport(c){
 const pays=DB.payments.filter(p=>p.cashId===c.id),by={};Object.keys(ML).forEach(k=>by[k]=0);
 pays.forEach(p=>by[p.method]=r2((by[p.method]||0)+p.amount));

 const items=sales.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0);
 const vendido=r2(sales.reduce((s,o)=>s+o.total,0));
 const recebido=r2(pays.reduce((s,p)=>s+p.amount,0));
 const sangria=r2((c.moves||[]).filter(m=>m.t==='sangria').reduce((s,m)=>s+m.v,0)),supr=r2((c.moves||[]).filter(m=>m.t==='suprimento').reduce((s,m)=>s+m.v,0));
 const esperado=r2(c.openAmount+by.dinheiro+supr-sangria);
 return{by,sales,items,vendido,recebido,esperado,sangria,supr,lucro:r2(sales.reduce((s,o)=>s+orderProfit(o),0))};
}

/* =====================================================================
   TECLADO GLOBAL
   Modais (qualquer tela): Esc fecha o do topo · Enter = ação principal (onEnter) · onKey do modal
   PDV sem modal: F2 busca · F4 finalizar · F6 câmera · F8 limpar · + − quantidade · ↑ ↓ item
   Setas na busca: com texto (ou produto já destacado) andam pela lista de produtos e Enter adiciona o destacado;
   com a busca vazia escolhem o item da venda (venda vazia: ↓ entra na lista). Fora do PDV, F2 vai para Vender.
                  Delete remove · Esc limpa a busca · leitor USB com foco fora da busca
   F1/F3/F7 (ajuda, localizar, navegação por cursor) ficam bloqueadas no PDV; F5 recarrega normalmente
   (o carrinho fica salvo).
   ===================================================================== */
const PDV_FKEYS={F2:()=>focusSearch(),F4:()=>pdvFinish(),F6:()=>pdvCam(),F8:()=>pdvClear()};
const BLOCKED_FKEYS=['F1','F3','F7'];
const isTyping=t=>!!t&&(t.tagName==='TEXTAREA'||t.isContentEditable||(t.tagName==='INPUT'&&!['checkbox','radio','button','submit','file','range','color'].includes(t.type)));
const printable=e=>e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey;
/* leitor USB/teclado com o foco fora da busca: o 1º caractere vai para a busca e o resto já cai nela */
function startScanCapture(ch){const ps=$('#ps');if(!ps)return;ps.focus();ps.value=ch;pdvQ=ch;pdvGrid()}
document.addEventListener('keydown',e=>{
 if(MODE!=='pdv'&&e.key==='F2'&&!modals.length){e.preventDefault();location.hash='#/pdv';return}
 if(MODE==='pdv'){
  if(BLOCKED_FKEYS.includes(e.key)){e.preventDefault();return}
  if(PDV_FKEYS[e.key]){e.preventDefault();if(!modals.length&&!e.repeat)PDV_FKEYS[e.key]();return}
 }
 if(modals.length)modalKey(e);
 else if(MODE==='pdv')pdvKey(e);
});
function modalKey(e){
 const top=topModal();
 if(e.key==='Escape'){e.preventDefault();closeModal(top.el);return}
 if(e.defaultPrevented)return;   /* campo com Enter próprio (ex.: leitor no modal) já tratou */
 if(top.onKey&&top.onKey(e)){e.preventDefault();return}
 if(e.key==='Enter'){
  const t=e.target;
  if(t.tagName==='BUTTON'||t.tagName==='A'||t.tagName==='TEXTAREA'||t.type==='file')return; /* o navegador ativa o elemento focado */
  if(top.onEnter){e.preventDefault();if(!e.repeat)top.onEnter()}
  return;
 }
 if(top.scanThrough&&MODE==='pdv'&&printable(e)&&e.key!==' '&&!isTyping(e.target)){
  e.preventDefault();closeModal(top.el);if(!modals.length)startScanCapture(e.key);
 }
}
function pdvKey(e){
 const t=e.target;
 if(e.key==='Escape'){if($('#ps')&&$('#ps').value){e.preventDefault();clearPS()}else if(pdvHi>=0)pdvHiSet(-1);focusSearch();return}
 if(isTyping(t)||e.ctrlKey||e.metaKey||e.altKey)return;   /* a busca tem os próprios atalhos (ps.onkeydown) */
 if(e.key==='+'||e.key==='-'){e.preventDefault();pdvQty(e.key==='+'?1:-1);return}
 if(e.key==='Delete'){e.preventDefault();pdvRemove();return}
 if((e.key==='ArrowDown'||e.key==='ArrowUp')&&t.tagName!=='SELECT'){e.preventDefault();pdvMoveSel(e.key==='ArrowDown'?1:-1);return}
 if(printable(e)&&e.key!==' '){e.preventDefault();startScanCapture(e.key)}
}

function prodModal(id){

 const el=modal(`<h2 class="h">${id?'Editar produto':'Novo produto'}</h2>
 <div class="row" style="align-items:flex-start;gap:14px;flex-wrap:nowrap"><div class="phprev" id="phv"></div><div style="flex:1;min-width:0"><label class="f" style="margin-top:0">Nome *</label><input class="input" id="pn2" value="${esc(p.name)}" autofocus>
 <div class="row" style="margin-top:8px"><label class="btn s" style="cursor:pointer">${I.cam} Foto do produto<input type="file" accept="image/*" capture="environment" id="pph" hidden></label><button type="button" class="btn s ghost" id="phx">Remover foto</button></div></div></div>

 <label class="f">Aplicação (veículos compatíveis)</label><textarea class="input" id="papp" placeholder="Ex.: GM Corsa 1.0/1.4 94>, Classic 1.0 94>">${esc(p.app||'')}</textarea>
 <div class="grid2"><div><label class="f">Código de barras / SKU *</label><div class="row"><input class="input" id="pc" style="flex:1" value="${esc(p.code)}"><button class="btn s" id="pcs" title="Ler com câmera">${I.cam}</button><button class="btn s" id="pcg" title="Gerar EAN interno">Gerar</button></div></div>
 <div><label class="f">Categoria</label><select class="input" id="pct">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
 <div><label class="f">Custo (R$)</label><input class="input" id="pco" inputmode="decimal" value="${m2s(p.cost)}"></div><div><label class="f">Preço de venda (R$)</label><input class="input" id="ppr" inputmode="decimal" value="${m2s(p.price)}"></div>
 ${id?'':`<div><label class="f">Estoque inicial</label><input class="input" id="pst" inputmode="numeric" value="0"></div>`}<div><label class="f">Estoque mínimo (alerta)</label><input class="input" id="pmi" inputmode="numeric" value="${p.min}"></div></div>
 <p class="mut sm" id="pmg"></p>
 <div class="foot">${id?'<button class="btn r" data-del>Excluir</button><span class="sp"></span>':''}<button class="btn y lg" data-ok>Salvar</button></div>`,{onEnter:()=>saveP()});
 /* foto: p.img (enviada pelo usuário, reduzida) > foto do catálogo > ícone */
 let img=p.img||'',noImg=false;
 const drawPh=()=>{const u=img||(!noImg&&PIMG[$('#pc',el).value.trim()])||'',b=$('#phv',el);b.style.backgroundImage=u?`url(${u})`:'';b.innerHTML=u?'':catIcon({cat:$('#pct',el).value})};
 $('#pph',el).onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{img=await shrinkImg(f,240);noImg=false;drawPh()}catch(err){toast('Não foi possível ler esta imagem','err')}};
 $('#phx',el).onclick=()=>{img='';noImg=true;drawPh()};
 $('#pct',el).addEventListener('change',drawPh);$('#pc',el).addEventListener('input',drawPh);drawPh();
 const mg=()=>{const c=parseMoney($('#pco',el).value),v=parseMoney($('#ppr',el).value);$('#pmg',el).textContent=v?`Margem: ${fmt(v-c)} (${Math.round((v-c)/v*100)}%)`:''};
 $('#pco',el).oninput=mg;$('#ppr',el).oninput=mg;mg();
 /* leitor USB manda Enter no fim do código: pula para o próximo campo em vez de salvar pela metade */
 $('#pc',el).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#pct',el).focus()}};
 $('#pcs',el).onclick=()=>openScanner({title:'Ler código do produto',onCode:c=>$('#pc',el).value=c});
 $('#pcg',el).onclick=()=>{let n=DB.products.length+1,c;do{c=mkEan('200'+pad(n++,9))}while(byCode(c));$('#pc',el).value=c};
 if(id)el.querySelector('[data-del]').onclick=async()=>{if(!await confirmBox(`Excluir <b>${esc(p.name)}</b>? O histórico é mantido.`,'Excluir','r'))return;tx(db=>{db.products=db.products.filter(x=>x.id!==id)});closeModal(el);toast('Produto excluído');refresh()};
 let saved=false;
 const saveP=()=>{
  if(saved)return;
  const d={name:$('#pn2',el).value.trim(),code:$('#pc',el).value.trim(),cat:$('#pct',el).value,cost:Math.max(0,parseMoney($('#pco',el).value)),price:Math.max(0,parseMoney($('#ppr',el).value)),min:Math.max(0,parseInt($('#pmi',el).value)||0),brand:$('#pbr',el).value.trim(),ref:$('#pref',el).value.trim(),app:$('#papp',el).value.trim()};
  if(!d.name||!d.code)return toast('Preencha nome e código','err');
  const dup=DB.products.find(x=>x.code===d.code&&x.id!==id);if(dup)return toast('Código já usado por: '+esc(dup.name),'err');
  d.service=d.cat==='servico';
  d.img=img||(noImg?'':undefined);if(d.img===undefined)delete d.img;if(noImg&&!img&&PIMG[d.code])d.img='none';

  tx(db=>{

   else{const np={id:'p'+uid(),...d,stock:0};db.products.push(np);const st=Math.max(0,parseInt($('#pst',el).value)||0);if(st&&!np.service)mov(db,np.id,st,'inicial','Cadastro do produto','ESTOQUE',operator())}
  });

function quickEntry(pid){
 const p=prod(pid);if(!p)return;let done=false;
 const el=modal(`<h2 class="h">Entrada de estoque</h2><p><b>${esc(p.name)}</b> · atual: ${p.stock} un</p><label class="f">Quantidade</label><input class="input big" id="qq" inputmode="numeric" value="1" autofocus><label class="f">Referência (NF, fornecedor…)</label><input class="input" id="qr" placeholder="Ex.: NF 1234"><div class="foot"><button class="btn y lg" data-ok>Dar entrada</button></div>`,{onEnter:()=>go()});
 function go(){
  if(done)return;const v=$('#qq',el).value.trim();if(!/^\d+$/.test(v)||+v<=0)return toast('Quantidade inválida','err');
  const q=+v;done=true;
  tx(db=>mov(db,pid,q,'entrada',$('#qr',el).value.trim()||'Entrada manual','ESTOQUE',operator()));
  closeModal(el);toast(`+${q} ${esc(p.name)}`,'ok');refresh();
 }
 el.querySelector('[data-ok]').onclick=go;
}
/* ajuste de inventário: informa a quantidade contada; a diferença é calculada sobre o estoque mais novo */
function adjustModal(pid){
 const p=prod(pid);if(!p)return;let done=false;
 const el=modal(`<h2 class="h">Ajuste de estoque</h2><p><b>${esc(p.name)}</b> · sistema: <b>${p.stock}</b> un</p><label class="f">Quantidade contada (inventário)</label><input class="input big" id="aq" inputmode="numeric" value="${p.stock}" autofocus><label class="f">Motivo *</label><select class="input" id="am"><option>Inventário / contagem</option><option>Avaria / quebra</option><option>Uso interno na oficina</option><option>Devolução ao fornecedor</option><option>Correção de lançamento</option></select><div class="foot"><button class="btn y lg" data-ok>Salvar ajuste</button></div>`,{onEnter:()=>go()});
 function go(){
  if(done)return;const v=$('#aq',el).value.trim();if(!/^\d+$/.test(v))return toast('Quantidade inválida','err');
  const n=+v;let d=0;done=true;
  tx(db=>{const x=prod2(db,pid);if(!x)return;d=r2(n-x.stock);if(d)mov(db,pid,d,'ajuste',$('#am',el).value,'ESTOQUE',operator())});
  closeModal(el);toast(d?`Estoque ajustado (${d>0?'+':''}${d})`:'Sem diferença — nada a ajustar',d?'ok':'');refresh();
 }
 el.querySelector('[data-ok]').onclick=go;
}
function scanEntry(){
 const log=[];
 const el=modal(`<h2 class="h">Entrada por scanner</h2><p class="mut">Bipe o produto (leitor USB ou câmera). Cada leitura soma a quantidade abaixo no estoque.</p>
 <div class="row"><div style="width:110px"><label class="f">Qtd por leitura</label><input class="input" id="sq2" inputmode="numeric" value="1"></div><div style="flex:1"><label class="f">Referência</label><input class="input" id="sr" placeholder="Ex.: NF 5678 / Fornecedor"></div></div>
 <label class="f">Código</label><div class="row"><input class="input big" id="sc" style="flex:1" placeholder="Bipe aqui" autofocus><button class="btn g lg" id="scam">${I.cam}</button></div><div id="slog" style="margin-top:10px"></div>`,{onClose:()=>{if(log.length)refresh()}});
 const add=code=>{const p=byCode(code);if(!p||p.service){beep(false);toast(`Código não cadastrado: ${esc(code)} — cadastre em “Novo produto”`,'err');return}
  const q=Math.max(1,parseInt($('#sq2',el).value)||1);tx(db=>mov(db,p.id,q,'entrada',$('#sr',el).value||'Entrada por scanner','ESTOQUE',operator()));beep(true);
  log.unshift(`<div class="li flash"><span class="pill ok">+${q}</span><b style="flex:1">${esc(p.name)}</b><span class="mut">agora ${prod(p.id).stock} un</span></div>`);$('#slog',el).innerHTML=log.slice(0,8).join('')};
 const sc=$('#sc',el);sc.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(sc.value.trim())add(sc.value.trim());sc.value=''}};
 $('#scam',el).onclick=()=>openScanner({title:'Entrada por câmera',continuous:true,onCode:add});
}
/* sugestão de reposição ("Repor"): leva o estoque a max(2×mínimo, mínimo+5); nunca menos de 1 */
const sugRepor=p=>Math.max(1,Math.max(p.min*2,p.min+5)-p.stock);
/* NF já lançada? mesma chave de acesso, ou mesmo fornecedor + número + série (ignora zeros à esquerda/acentos) */
const nz=s=>String(s||'').trim().replace(/^0+(?=\d)/,'');
function nfDup(db,sup,num,serie,key){
 key=onlyDigits(key);
 return db.nfs.find(n=>(key&&onlyDigits(n.key)===key)||(norm(n.supplier).trim()===norm(sup).trim()&&nz(n.number)===nz(num)&&nz(n.serie||'1')===nz(serie||'1')));
}

 <div><label class="f">Qtd</label><input class="input" id="nfq" inputmode="numeric" value="1"></div><div><label class="f">Custo un.</label><input class="input" id="nfc" inputmode="decimal"></div><button class="btn g" id="nfa">${I.plus}</button></div>

 el._set=(i,k,v)=>{lines[i][k]=k==='qty'?Math.max(1,parseInt(v)||1):Math.max(0,parseMoney(v));draw()};el._del=i=>{lines.splice(i,1);draw()};

 np.onchange=()=>{const p=byCode(np.value)||DB.products.find(x=>norm(x.name)===norm(np.value));if(p&&!$('#nfc',el).value)$('#nfc',el).value=m2s(p.cost)};

 $('#nfa',el).onclick=addLine;np.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addLine()}};
 $('#nfx',el).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=new DOMParser().parseFromString(await f.text(),'text/xml');const tg=(n,r=x)=>{const e=r.getElementsByTagName(n)[0];return e?e.textContent.trim():''};
  const em=x.getElementsByTagName('emit')[0];if(em)$('#nfs',el).value=tg('xFant',em)||tg('xNome',em);$('#nfn',el).value=tg('nNF');$('#nfse',el).value=tg('serie')||'1';
  const inf=x.getElementsByTagName('infNFe')[0];if(inf&&inf.getAttribute('Id'))$('#nfk',el).value=inf.getAttribute('Id').replace(/\D/g,'');
  lines.length=0;   /* importar de novo substitui os itens (não duplica) */
  const miss=[];[...x.getElementsByTagName('det')].forEach(d=>{const ean=tg('cEAN',d)||tg('cEANTrib',d),cp=tg('cProd',d),nm=tg('xProd',d),q=Math.round(parseFloat(tg('qCom',d))||0),c=r2(parseFloat(tg('vUnCom',d))||0);const p=(ean&&byCode(ean))||(cp&&byCode(cp));if(p&&!p.service){if(q>0){const ex=lines.find(l=>l.pid===p.id);if(ex)ex.qty+=q;else lines.push({pid:p.id,qty:q,cost:c})}}else miss.push(nm+' ('+(ean||cp)+')')});
  draw();toast(`XML lido: ${lines.length} itens${miss.length?`, ${miss.length} não cadastrados`:''}`,miss.length?'y':'ok');const dx=nfDup(DB,$('#nfs',el).value,$('#nfn',el).value,$('#nfse',el).value,$('#nfk',el).value);if(dx)toast(`Atenção: esta NF já foi lançada em ${fdt(dx.ts)}`,'err');
  if(miss.length)modal(`<h2 class="h">Itens não encontrados</h2><p>Cadastre estes produtos (com o mesmo código EAN) e importe de novo:</p><ul>${miss.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`)}catch(err){toast('Não foi possível ler o XML','err')}e.target.value=''};
 let saved=false;
 el.querySelector('[data-ok]').onclick=()=>{

  const sup=$('#nfs',el).value.trim(),num=$('#nfn',el).value.trim(),serie=$('#nfse',el).value.trim()||'1',key=onlyDigits($('#nfk',el).value);

/* cancelamento: estorna o estoque UMA vez (conferido dentro da transação) e lança a devolução no caixa aberto */
async function cancelOrder(id){
 const o=DB.orders.find(x=>x.id===id);if(!o||!valid(o))return false;
 const pm=o.method;
 if(!await confirmBox(`Cancelar o pedido <b>${esc(o.num)}</b>? Os itens voltam para o estoque.${o.paid?`<br><br><b style="color:var(--red)">Este pedido está pago (${ML[pm]} ${fmt(o.total)}): faça a devolução do valor ao cliente.</b>`:''}`,'Cancelar pedido','r'))return false;
 const user=operator();
 const x=tx(db=>{const x=db.orders.find(y=>y.id===id);if(!x||x.status==='cancelado')return null;x.status='cancelado';x.cancelTs=Date.now();x.cancelBy=user;
  x.items.forEach(i=>{if(!i.service&&prod2(db,i.pid))mov(db,i.pid,i.qty,'estorno','Cancelamento '+x.num,x.channel||'PDV',user)});
  if(x.paid){const cash=db.cash.find(c=>c.status==='aberto');x.refunded=true;
   db.payments.push({id:uid(),ts:Date.now(),orderId:x.id,num:x.num,method:x.method,amount:-x.total,cashId:cash?cash.id:null,kind:'estorno',user})}
  return x});
 if(!x){toast(`Pedido ${esc(o.num)} já estava cancelado`,'y');refresh();return true}
 toast(`Pedido ${esc(o.num)} cancelado, estoque estornado`,'ok');refresh();return true;
}

<script>
/* ===== Sincronização dos PRODUTOS com o Supabase (tabela public.products) =====
   O navegador continua usando o localStorage; o Supabase guarda uma cópia dos produtos
   (cadastro, preço, custo, estoque) e a devolve ao abrir o sistema em outro computador. */
(function(){
 const SB_URL='https://rvpfymftfnrnevcoadtc.supabase.co';
 const SB_KEY='sb_publishable_WPw0gHqQPNy1QbQXxuMlvg_nb-Xc6Jh';
 const T=SB_URL+'/rest/v1/products';
 const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
 let timer=null,busy=false,pulled=false,lastCodes=new Set(),warned=false;
 const warn=m=>{if(warned)return;warned=true;try{toast(m,'err')}catch(e){}};
 const toRemote=p=>({code:String(p.code),name:p.name,brand:p.brand||'',ref:p.ref||'',category:p.cat||'',application:p.app||'',
  cost:+p.cost||0,price:+p.price||0,stock:+p.stock||0,min_stock:+p.min||0,is_service:!!p.service,updated_at:new Date().toISOString()});
 const toLocal=r=>({code:r.code,name:r.name,brand:r.brand||'',ref:r.ref||'',cat:r.category||'',app:r.application||'',
  cost:+r.cost||0,price:+r.price||0,stock:+r.stock||0,min:+r.min_stock||0,service:!!r.is_service});
 async function fetchRemote(){
  const r=await fetch(T+'?select=*&order=name.asc&limit=5000',{headers:H});
  if(!r.ok)throw new Error('GET '+r.status);
  return r.json();
 }
 async function push(){
  if(busy||!pulled)return;busy=true;
  try{
   const list=DB.products.filter(p=>p.code&&p.name);
   if(list.length){
    const r=await fetch(T+'?on_conflict=code',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(list.map(toRemote))});
    if(!r.ok)throw new Error('UPSERT '+r.status);
    const keep=new Set(list.map(p=>String(p.code)));
    const gone=[...lastCodes].filter(c=>!keep.has(c));
    for(const c of gone){
     const d=await fetch(T+'?code=eq.'+encodeURIComponent(c),{method:'DELETE',headers:H});
     if(!d.ok)throw new Error('DELETE '+d.status);
    }
    lastCodes=keep;
   }
  }catch(e){console.warn('Supabase:',e);warn('Sem conexão com o Supabase — os produtos serão enviados quando voltar')}
  busy=false;
 }
 function schedule(){clearTimeout(timer);timer=setTimeout(push,1500)}
 async function pull(){
  try{
   const rows=await fetchRemote();
   const untouched=rows.length&&rows.every(r=>!+r.cost&&!+r.price&&!+r.stock);
   const localUsed=DB.products.some(p=>+p.cost||+p.price||+p.stock);
   if(!rows.length||(untouched&&localUsed)){
    /* Supabase vazio ou ainda "virgem": o que está neste computador é o mais completo — envia */
    pulled=true;lastCodes=new Set(rows.map(r=>String(r.code)));await push();return;
   }
   const byC=new Map(DB.products.map(p=>[String(p.code),p]));
   rows.forEach(r=>{
    const l=toLocal(r),x=byC.get(String(r.code));
    if(x)Object.assign(x,l);else DB.products.push({id:'p'+uid(),...l});
   });
   const rc=new Set(rows.map(r=>String(r.code)));
   lastCodes=rc;pulled=true;
   lsSet(KEY,DB);              /* grava local sem disparar novo envio */
   try{refresh()}catch(e){}
   /* produtos que só existem aqui sobem na próxima gravação */
   if(DB.products.some(p=>!rc.has(String(p.code))))schedule();
  }catch(e){console.warn('Supabase:',e);warn('Não foi possível ler o Supabase — usando os dados deste computador')}
 }
 const _save=save;
 save=function(){_save();if(pulled)schedule()};
 window.sbSync=pull;
 pull();
 window.addEventListener('online',()=>{pulled?schedule():pull()});
})();
</script>
