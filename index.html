<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14323A">
<title>Bancada — Loja, PDV e Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EAE7;--g:#14323A;--g2:#1d4550;--g3:#0d2328;--y:#F2B705;--y2:#dba604;
  --ink:#14323A;--mut:#5b696c;--line:#d2d6d1;--card:#fff;--soft:#f3f4f2;
  --red:#C62828;--redbg:#fdeceb;--ok:#2E7D32;--okbg:#e6f4e7;--blue:#1565C0;--bluebg:#e5effb;
  --r:12px;--sh:0 1px 2px rgba(20,50,58,.07),0 4px 16px rgba(20,50,58,.07)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h{font-family:"Barlow Condensed",Barlow,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:800;margin:0}
h2.h{font-size:26px;margin-bottom:12px}
h3.h{font-size:19px;margin-bottom:10px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;background:#fff;color:var(--g);border:1.5px solid var(--line);min-height:44px;transition:transform .06s,background .15s,border-color .15s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--g)}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--y);border-color:var(--y);color:var(--g)}
.btn.y:hover{background:var(--y2);border-color:var(--y2)}
.btn.g{background:var(--g);border-color:var(--g);color:#fff}
.btn.g:hover{background:var(--g2)}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(20,50,58,.06)}
.btn.s{min-height:34px;padding:5px 10px;font-size:14px;border-radius:8px}
.btn.lg{min-height:56px;font-size:18px;padding:12px 22px}
.btn.xl{min-height:76px;font-size:26px;width:100%;font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.03em;border-radius:14px}
.btn.xl small{font-size:15px;opacity:.7;font-family:Barlow;text-transform:none}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
.input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(242,183,5,.4)}
.input.big{font-size:28px;font-weight:700;min-height:60px}
textarea.input{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:10px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--g)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eceeeb;color:var(--g);white-space:nowrap}
.pill.y{background:#fff1c2;color:#6e5200}
.pill.r{background:var(--redbg);color:var(--red)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.b{background:var(--bluebg);color:var(--blue)}
.pill.g{background:var(--g);color:#fff}
.st-novo{background:var(--bluebg);color:var(--blue)}
.st-pago{background:#e8e2f8;color:#5b3bb0}
.st-ag{background:#fff1c2;color:#6e5200}
.st-ok{background:var(--okbg);color:var(--ok)}
.st-x{background:#eceeeb;color:#7c8587;text-decoration:line-through}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chip b{opacity:.65;margin-left:4px}
.empty{text-align:center;padding:30px 12px;color:var(--mut)}
.tbl-w{overflow-x:auto;border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--soft)}
table.t td{padding:9px 12px;border-bottom:1px solid #ebedea;vertical-align:middle}
table.t tr.low td{background:var(--redbg)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fafbf9}
.r-al{text-align:right!important}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
.logo .mk{width:34px;height:34px;border-radius:8px;background:var(--y);color:var(--g);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:800;font-size:22px}
.logo .nm{font-family:"Barlow Condensed";font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.ico{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--g);flex:none}
.ico svg.i{width:24px;height:24px}

/* toast & modal */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--g);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:tin .2s ease-out;display:flex;gap:10px;align-items:center}
.toast.err{background:var(--red)}
.toast.ok{background:var(--ok)}
.toast.y{background:var(--y);color:var(--g)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.ov{position:fixed;inset:0;background:rgba(13,35,40,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fin .15s}
@keyframes fin{from{opacity:0}}
.md{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 18px 20px;position:relative;outline:none}
.md.wide{max-width:920px}
@media(min-width:700px){.ov{align-items:center;padding:20px}.md{border-radius:18px;padding:26px}}
.mx{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:24px;line-height:1;color:var(--g)}
.md .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ================= LOJA ================= */
.shop-h{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}
.shop-h .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.shop-h .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.shop-h .btn.y{background:var(--y);color:var(--g);border-color:var(--y)}
.cbadge{background:var(--y);color:var(--g);border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px;font-weight:800}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.hero{background:var(--g);color:#fff;border-radius:18px;padding:26px 20px;position:relative;overflow:hidden;margin-bottom:18px}
.hero h1{font-family:"Barlow Condensed";font-size:38px;line-height:1;margin:0 0 10px;text-transform:uppercase;font-weight:800}
.hero h1 em{font-style:normal;color:var(--y)}
.hero p{margin:0 0 18px;opacity:.85;max-width:520px}
.hero .stripe{position:absolute;right:-40px;top:0;bottom:0;width:180px;background:repeating-linear-gradient(-45deg,var(--y) 0 18px,transparent 18px 36px);opacity:.16}
@media(min-width:800px){.hero{padding:44px 40px}.hero h1{font-size:56px}}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:22px}
.perk{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:12px;font-weight:600;font-size:14px}
.perk .ico{width:38px;height:38px;background:#fff1c2}
.searchbar{position:relative;margin-bottom:12px}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.searchbar .input{padding-left:42px;min-height:50px}
.pgrid-s{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.pgrid-s{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1000px){.pgrid-s{grid-template-columns:repeat(4,1fr)}}
.pc{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.pc .thumb{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,#f3f4f2,#e3e6e2);display:grid;place-items:center;color:var(--g);position:relative}
.pc .thumb svg.i{width:46%;height:46%;stroke-width:1.5}
.pc .thumb .pill{position:absolute;left:8px;top:8px}
.pc .nm{font-weight:700;font-size:15px;line-height:1.2;min-height:36px}
.pc .pr{font-family:"Barlow Condensed";font-size:24px;font-weight:800}
.pc .btn{margin-top:auto}
.shop-f{background:var(--g3);color:#cfd7d8;margin-top:30px}
.shop-f .in{max-width:1180px;margin:0 auto;padding:24px 16px;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;font-size:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:110;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:din .2s ease-out}
@keyframes din{from{transform:translateX(100%)}}
.drawer .dh{padding:16px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow:auto;padding:12px 16px}
.drawer .df{padding:16px;border-top:1px solid var(--line)}
.cl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eceeeb}
.cl .ico{width:44px;height:44px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--soft);width:34px;height:34px;font-size:18px;font-weight:800}
.qty span{min-width:34px;text-align:center;font-weight:700}
.tline{display:flex;justify-content:space-between;padding:4px 0}
.tline.big{font-size:22px;font-weight:800;font-family:"Barlow Condensed";border-top:1.5px solid var(--line);margin-top:6px;padding-top:10px}
.co{display:grid;gap:16px}
@media(min-width:900px){.co{grid-template-columns:1.4fr 1fr;align-items:start}.co .sum{position:sticky;top:80px}}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:10px;background:#fff}
.opt.on{border-color:var(--g);background:#f6f8f6;box-shadow:inset 4px 0 0 var(--y)}
.opt input{margin-top:4px;accent-color:var(--g);width:18px;height:18px}
.opt b{display:block}
.qr{width:220px;height:220px;margin:10px auto;display:block;background:#fff;padding:10px;border-radius:10px;border:1.5px solid var(--line)}
.pixcode{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--soft);padding:10px;border-radius:8px}
.steps{display:flex;gap:6px;margin:14px 0}
.steps div{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.steps div::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--g)}
.steps div.on::before{background:var(--y)}

/* ================= PDV ================= */
body.m-pdv{overflow:hidden}
.pdv{height:100vh;height:100dvh;display:flex;flex-direction:column}
.pbar{background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.pbar .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18);min-height:42px;padding:6px 12px}
.pbar .btn:hover{border-color:#fff}
.pbar .btn.y{background:var(--y);color:var(--g);border-color:var(--y)}
.pbar select{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.18);border-radius:10px;min-height:42px;padding:0 8px}
.pbar select option{color:var(--g)}
.cx{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;border:0;min-height:42px}
.cx.on{background:#1f5a3a;color:#c9f2d5}
.cx.off{background:var(--red);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.75}}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.net{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
.net.off{background:var(--y);color:var(--g)}
.pmain{flex:1;display:grid;grid-template-columns:1fr;min-height:0;overflow:auto}
.pleft{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.psearch{display:flex;gap:8px}
.psearch .input{font-size:20px;min-height:60px;font-weight:600}
.psearch .btn{min-height:60px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:minmax(152px,auto);gap:10px;align-content:start;overflow:auto;padding-bottom:10px;flex:1;min-height:0}
.pt{background:#fff;border:2px solid transparent;border-radius:12px;padding:10px 10px 12px;height:auto;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:152px;box-shadow:var(--sh);position:relative}
.pt:hover{border-color:var(--g)}
.pt:active{transform:scale(.97)}
.pt .ico{width:38px;height:38px}
.pt .ico svg.i{width:20px;height:20px}
.pt .n{font-weight:700;font-size:14px;line-height:1.15}
.pt .p{font-family:"Barlow Condensed";font-weight:800;font-size:22px;margin-top:auto;line-height:1.15;padding-bottom:2px}
.pt .s{position:absolute;top:8px;right:8px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--soft)}
.pt.low{border-color:var(--red);background:#fff7f6}
.pt.low .s{background:var(--red);color:#fff}
.pt.out{opacity:.55}
.pt.svc .ico{background:#fff1c2}
.pright{background:#fff;display:flex;flex-direction:column;min-height:0;border-top:3px solid var(--y)}
.chd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.clines{flex:1;overflow:auto;min-height:120px}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid #eceeeb;cursor:pointer;border-left:5px solid transparent}
.ln.sel{background:#fffbea;border-left-color:var(--y)}
.ln .a{font-weight:700;line-height:1.2}
.ln .b{font-size:13px;color:var(--mut)}
.ln .c{font-family:"Barlow Condensed";font-weight:800;font-size:21px;text-align:right}
.ln .d{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.ln .d .qty button{width:40px;height:38px}
.cact{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.cact .btn{min-height:52px;padding:4px;font-size:15px;flex-direction:column;gap:0}
.cact .btn small{font-size:11px;font-weight:600;opacity:.6}
.ctot{padding:6px 14px}
.ctot .tline.big{font-size:34px;border-top:0;margin:0;padding:2px 0}
.fin{padding:0 10px 10px}
.pkeys{background:var(--g3);color:#a9b8ba;font-size:13px;padding:6px 12px;display:none;gap:16px;flex-wrap:wrap}
.pkeys b{color:var(--y);font-weight:800}
@media(min-width:960px){
  .pmain{grid-template-columns:1fr 420px;overflow:hidden}
  .pright{border-top:0;border-left:3px solid var(--y)}
  .pkeys{display:flex}
}
@media(max-width:959px){
  body.m-pdv{overflow:auto}
  .pdv{height:auto;min-height:100vh}
  .pg{max-height:none}
  .fin{position:sticky;bottom:0;background:#fff;padding-top:8px;box-shadow:0 -6px 16px rgba(0,0,0,.06)}
}
.pmain>*,.dgrid>*,.co>*,.kan>*,.grid2>*,.pleft>*{min-width:0}
.flash{animation:fl .5s}
@keyframes fl{0%{background:#fff1c2}}
.pay .paytot{font-size:18px;display:flex;justify-content:space-between;align-items:center;background:var(--g);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px}
.pay .paytot b{font-family:"Barlow Condensed";font-size:38px;color:var(--y)}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(min-width:560px){.paym{grid-template-columns:repeat(5,1fr)}}
.pm{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;position:relative;min-height:84px}
.pm .k{position:absolute;top:4px;left:7px;font-size:11px;color:var(--mut);font-weight:700}
.pm.on{border-color:var(--g);background:var(--g);color:#fff}
.pm.on svg{color:var(--y)}
.notes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.troco{display:flex;justify-content:space-between;align-items:center;background:var(--okbg);color:var(--ok);border-radius:12px;padding:12px 16px;font-weight:700;margin:6px 0 12px}
.troco b{font-family:"Barlow Condensed";font-size:34px}
.troco.neg{background:var(--redbg);color:var(--red)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:10%;right:10%;top:35%;bottom:35%;border:3px solid var(--y);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.cam .aim::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--red);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:10%}to{top:90%}}

/* receipt */
.rcpt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;background:#fffef8;border:1px dashed #c8c8b8;border-radius:8px;padding:14px;max-width:360px;margin:0 auto;color:#111}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .tt{font-size:17px;font-weight:800}
.okhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.okhead .ico{background:var(--okbg);color:var(--ok);width:54px;height:54px;border-radius:50%}

/* ================= PAINEL ================= */
.adm-h{background:var(--g);color:#fff}
.adm-h .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.adm-h .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18);min-height:40px;padding:6px 12px}
.adm-h .btn.y{background:var(--y);color:var(--g);border-color:var(--y)}
.tabs{background:var(--g2);position:sticky;top:0;z-index:15}
.tabs .in{max-width:1280px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs a{color:#c7d3d5;text-decoration:none;font-weight:700;padding:13px 14px;white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tabs a.on{color:#fff;border-bottom-color:var(--y)}
.tabs a .cbadge{font-size:11px}
.adm{max-width:1280px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}

/* ---------- EAN-13 ---------- */
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return (10-s%10)%10}
const mkEan=d12=>d12+eanCheck(d12);

function eanSVG(code){
 if(!isEan(code))return `<div class="sm" style="font-family:monospace;padding:14px 0">${esc(code)}</div>`;
 const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
 const R=L.map(s=>s.replace(/./g,c=>c==='0'?'1':'0')), G=R.map(s=>s.split('').reverse().join(''));
 const P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
 const d=code.split('').map(Number);let bits='101',guard=[[0,3]];
 for(let i=1;i<=6;i++)bits+=(P[d[0]][i-1]==='L'?L:G)[d[i]];
 guard.push([bits.length,5]);bits+='01010';
 for(let i=7;i<=12;i++)bits+=R[d[i]];
 guard.push([bits.length,3]);bits+='101';
 const isG=i=>guard.some(([s,l])=>i>=s&&i<s+l);
 const w=2,x0=14;let rects='';
 for(let i=0;i<bits.length;i++)if(bits[i]==='1')rects+=`<rect x="${x0+i*w}" y="2" width="${w}" height="${isG(i)?62:54}"/>`;
 const W=x0*2+bits.length*w;
 return `<svg viewBox="0 0 ${W} 76" xmlns="http://www.w3.org/2000/svg" style="background:#fff">${rects}<g font-family="monospace" font-size="12" text-anchor="middle"><text x="7" y="72">${d[0]}</text><text x="${x0+3*w+21*w}" y="72">${code.slice(1,7)}</text><text x="${x0+50*w+21*w}" y="72">${code.slice(7)}</text></g></svg>`;
}

/* ---------- leitor por câmera ---------- */
function openScanner({title='Escanear código',continuous=false,onCode}){
 let stream,stopped=false,reader,last='',lastT=0;
 const stop=()=>{stopped=true;if(stream)stream.getTracks().forEach(t=>t.stop());if(reader)try{reader.reset()}catch(e){}};
 const el=modal(`<h2 class="h">${title}</h2><div class="cam"><video playsinline muted autoplay></video><div class="aim"></div></div>
  <p class="mut sm" id="camst" style="margin:10px 0">Iniciando câmera…</p>
  <div class="row"><input class="input" id="man" placeholder="ou digite o código e Enter" style="flex:1"><button class="btn g" id="manok">OK</button></div>
  ${continuous?'<p class="mut sm">Modo contínuo: cada leitura entra no carrinho. Feche quando terminar.</p>':''}`,{onClose:stop});
 const video=$('video',el),st=$('#camst',el);
 const hit=code=>{code=String(code).trim();const t=Date.now();if(!code||(code===last&&t-lastT<1800))return;last=code;lastT=t;onCode(code);if(!continuous)closeModal(el);else st.innerHTML=`Último lido: <b>${esc(code)}</b>`};
 const man=$('#man',el);$('#manok',el).onclick=()=>{if(man.value.trim()){hit(man.value);man.value=''}};
 man.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();$('#manok',el).click()}};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Câmera indisponível neste navegador (precisa de HTTPS ou localhost). Use o leitor USB ou digite o código.';return}
 (async()=>{
  try{
   if('BarcodeDetector' in window){
    let formats=['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code'];
    try{const sup=await BarcodeDetector.getSupportedFormats();formats=formats.filter(f=>sup.includes(f))}catch(e){}
    const det=new BarcodeDetector({formats});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    if(stopped)return stop();
    video.srcObject=stream;await video.play();st.textContent='Aponte para o código de barras ou QR Code';
    const loop=async()=>{if(stopped)return;try{const r=await det.detect(video);if(r.length)hit(r[0].rawValue)}catch(e){}setTimeout(loop,120)};loop();
   }else{
    st.textContent='Carregando leitor…';
    if(!window.ZXing)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
    if(stopped)return;
    reader=new ZXing.BrowserMultiFormatReader();
    st.textContent='Aponte para o código de barras ou QR Code';
    reader.decodeFromVideoDevice(undefined,video,(res)=>{if(res&&!stopped)hit(res.getText())});
   }
  }catch(e){st.textContent='Não foi possível abrir a câmera ('+(e.name||e.message||'erro')+'). Use o leitor USB ou digite o código.'}
 })();
}

function pickupSlots(dateKey){
 const out=[],now=Date.now(),lead=(DB.settings.lead||60)*6e4,dow=new Date(dateKey+'T12:00').getDay();
 if(dow===0)return out;const end=dow===6?12:18;
 for(let h=8;h<end;h++)for(const m of [0,30]){const t=new Date(dateKey+'T'+pad(h)+':'+pad(m)).getTime();if(t>now+lead)out.push(pad(h)+':'+pad(m))}
 return out;
}
function pickupDays(){const out=[];for(let i=0;i<8&&out.length<6;i++){const k=dkey(Date.now()+i*864e5);if(pickupSlots(k).length)out.push(k)}return out}

function placeOnline(){
 const s=DB.settings,c=coState;
 if(!(c.name||'').trim())return toast('Informe seu nome','err');
 if(onlyDigits(c.phone).length<10)return toast('Informe um WhatsApp válido com DDD','err');
 if(c.fulfil==='retirada'&&(!c.date||!c.time))return toast('Escolha dia e horário da retirada','err');
 if(c.fulfil==='entrega'&&!(c.addr||'').trim())return toast('Informe o endereço de entrega','err');
 let err=null;
 const o=tx(db=>{
  for(const i of shopCart){const p=prod2(db,i.pid);if(!p||p.stock<i.qty){err=`${p?esc(p.name):'Produto'}: só ${p?p.stock:0} disponível. Ajuste o carrinho.`;return null}}
  const items=shopCart.map(i=>{const p=prod2(db,i.pid);return{pid:p.id,code:p.code,name:p.name,qty:i.qty,price:p.price,cost:p.cost,disc:0}});
  const fee=c.fulfil==='entrega'?s.fee:0,subtotal=r2(items.reduce((a,i)=>a+i.price*i.qty,0));
  const o={id:uid(),num:nextNum(db),ts:Date.now(),channel:'ONLINE',items,subtotal,discount:0,fee,total:r2(subtotal+fee),method:'pix',paid:false,status:'novo',seller:'Loja online',
   customer:{name:c.name.trim(),phone:c.phone.trim()},fulfil:c.fulfil,pickup:c.fulfil==='retirada'?{date:c.date,time:c.time}:null,address:c.fulfil==='entrega'?(c.addr+(c.comp?' — '+c.comp:'')):'',obs:c.obs||'',separated:{},ready:false};
  items.forEach(i=>mov(db,i.pid,-i.qty,'venda',o.num,'ONLINE','Cliente online'));
  db.orders.push(o);return o;
 });
 if(!o){toast(err,'err');drawCart();return}
 shopCart=[];saveShop();const mine=lsGet(MYORD,[]);mine.unshift(o.id);lsSet(MYORD,mine.slice(0,10));
 location.hash='#/loja/pedido/'+o.id;
}
function pixPayload(o){const base=`00020126580014BR.GOV.BCB.PIX0136${DB.settings.pix}5204000053039865406${o.total.toFixed(2)}5802BR5907BANCADA6009SAO PAULO62${pad(o.num.length+4)}05${pad(o.num.length)}${o.num}6304`;let h=0;for(const ch of base)h=(h*31+ch.charCodeAt(0))>>>0;return base+(h%65536).toString(16).toUpperCase().padStart(4,'0')}
function fakeQR(str){
 const N=29;let h=2166136261;const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296};for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);
 let r='';const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9))continue;if(rnd()<.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg class="qr" viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges">${r}${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}</svg>`;
}

function cashReport(c){

 const fiado=sales.filter(o=>o.method==='fiado');
 const deliv=DB.orders.filter(o=>o.deliveredCash===c.id&&o.channel==='ONLINE');
 const items=sales.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0);
 const vendido=r2(sales.reduce((s,o)=>s+o.total,0));
 const recebido=r2(pays.reduce((s,p)=>s+p.amount,0));
 const fiadoRec=r2(pays.filter(p=>p.kind==='fiado').reduce((s,p)=>s+p.amount,0));
 const sangria=r2((c.moves||[]).filter(m=>m.t==='sangria').reduce((s,m)=>s+m.v,0)),supr=r2((c.moves||[]).filter(m=>m.t==='suprimento').reduce((s,m)=>s+m.v,0));
 const esperado=r2(c.openAmount+by.dinheiro+supr-sangria);
 return{by,sales,fiado,deliv,items,vendido,recebido,fiadoRec,esperado,sangria,supr,lucro:r2(sales.reduce((s,o)=>s+orderProfit(o),0))};
}

let kbuf='',kT=0;

 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pdvMoveSel(e.key==='ArrowDown'?1:-1);return}
 // leitor USB digitando com o foco fora do campo: captura e manda para a busca
 if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const now=Date.now();if(now-kT>80)kbuf='';kbuf+=e.key;kT=now;e.preventDefault();const ps=$('#ps');ps.value=kbuf;pdvQ=kbuf;ps.focus();pdvGrid()}

function scanEntry(){

function nfModal(prefill){
 const lines=[];if(prefill){const p=prod(prefill);lines.push({pid:p.id,qty:Math.max(1,p.min*2-p.stock),cost:p.cost})}
 const el=modal(`<h2 class="h">${I.doc} Entrada por nota fiscal</h2>
 <div class="grid2"><div><label class="f">Fornecedor *</label><input class="input" id="nfs" list="nfsl" autofocus><datalist id="nfsl">${[...new Set(DB.nfs.map(n=>n.supplier))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>
 <div class="row" style="gap:8px"><div style="flex:2"><label class="f">Nº da NF *</label><input class="input" id="nfn" inputmode="numeric"></div><div style="flex:1"><label class="f">Série</label><input class="input" id="nfse" value="1"></div></div></div>
 <label class="f">Chave de acesso (44 dígitos, opcional)</label><input class="input" id="nfk" inputmode="numeric" maxlength="54">
 <div class="row" style="margin-top:10px"><label class="btn s" style="cursor:pointer">${I.down} Importar XML da NF-e<input type="file" accept=".xml,text/xml" id="nfx" hidden></label><span class="mut sm">Lê fornecedor, número e itens (pelo código EAN) automaticamente.</span></div>
 <h3 class="h" style="margin-top:16px">Itens da nota</h3>
 <div class="nfl"><div><label class="f">Produto (bipe ou busque)</label><input class="input" id="nfp" list="nfpl" placeholder="Código ou nome"><datalist id="nfpl">${DB.products.filter(p=>!p.service).map(p=>`<option value="${esc(p.code)}">${esc(p.name)}</option>`).join('')}</datalist></div>
 <div><label class="f">Qtd</label><input class="input" id="nfq" inputmode="numeric" value="1"></div><div><label class="f">Custo un.</label><input class="input" id="nfc" inputmode="decimal"></div><button class="btn g" id="nfa">${I.plus}</button></div>
 <div id="nfls" style="margin-top:10px"></div>
 <label class="chk"><input type="checkbox" id="nfuc" checked> Atualizar custo dos produtos com o valor da nota</label>
 <div class="foot"><span class="sp"></span><button class="btn y lg" data-ok>Lançar nota e somar estoque</button></div>`,{wide:true});
 const draw=()=>{$('#nfls',el).innerHTML=lines.length?`<div class="tbl-w"><table class="t"><thead><tr><th>Produto</th><th class="r-al">Atual</th><th class="r-al">Qtd</th><th class="r-al">Custo un.</th><th class="r-al">Total</th><th></th></tr></thead><tbody>${lines.map((l,i)=>{const p=prod(l.pid);return `<tr><td><b>${esc(p.name)}</b><div class="mut sm">${esc(p.code)}</div></td><td class="r-al">${p.stock}</td><td class="r-al"><input class="input" style="width:70px;min-height:34px" value="${l.qty}" onchange="this.closest('.ov')._set(${i},'qty',this.value)"></td><td class="r-al"><input class="input" style="width:90px;min-height:34px" value="${m2s(l.cost)}" onchange="this.closest('.ov')._set(${i},'cost',this.value)"></td><td class="r-al"><b>${fmt(l.qty*l.cost)}</b></td><td><button class="btn ghost s" onclick="this.closest('.ov')._del(${i})">${I.trash}</button></td></tr>`}).join('')}</tbody></table></div><div class="tline big"><span>Total da nota</span><span>${fmt(lines.reduce((s,l)=>s+l.qty*l.cost,0))}</span></div>`:'<div class="empty">Nenhum item. Bipe o código do produto acima.</div>'};
 el._set=(i,k,v)=>{lines[i][k]=k==='qty'?Math.max(1,parseInt(v)||1):parseMoney(v);draw()};el._del=i=>{lines.splice(i,1);draw()};
 const np=$('#nfp',el);
 np.onchange=()=>{const p=byCode(np.value)||DB.products.find(x=>norm(x.name)===norm(np.value));if(p&&!$('#nfc',el).value)$('#nfc',el).value=m2s(p.cost)};
 const addLine=()=>{const p=byCode(np.value)||DB.products.find(x=>norm(x.name)===norm(np.value));if(!p||p.service){beep(false);return toast('Produto não encontrado — cadastre primeiro','err')}
  const q=parseInt($('#nfq',el).value)||1,c=$('#nfc',el).value?parseMoney($('#nfc',el).value):p.cost;const ex=lines.find(l=>l.pid===p.id);if(ex)ex.qty+=q;else lines.push({pid:p.id,qty:q,cost:c});
  beep(true);np.value='';$('#nfq',el).value='1';$('#nfc',el).value='';np.focus();draw()};
 $('#nfa',el).onclick=addLine;np.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addLine()}};
 $('#nfx',el).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=new DOMParser().parseFromString(await f.text(),'text/xml');const tg=(n,r=x)=>{const e=r.getElementsByTagName(n)[0];return e?e.textContent.trim():''};
  const em=x.getElementsByTagName('emit')[0];if(em)$('#nfs',el).value=tg('xFant',em)||tg('xNome',em);$('#nfn',el).value=tg('nNF');$('#nfse',el).value=tg('serie')||'1';

  draw();toast(`XML lido: ${lines.length} itens${miss.length?`, ${miss.length} não cadastrados`:''}`,miss.length?'y':'ok');if(miss.length)modal(`<h2 class="h">Itens não encontrados</h2><p>Cadastre estes produtos (com o mesmo código EAN) e importe de novo:</p><ul>${miss.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`)}catch(err){toast('Não foi possível ler o XML','err')}};
 el.querySelector('[data-ok]').onclick=()=>{
  const sup=$('#nfs',el).value.trim(),num=$('#nfn',el).value.trim();if(!sup||!num)return toast('Informe fornecedor e número da NF','err');if(!lines.length)return toast('Adicione os itens da nota','err');

  const uc=$('#nfuc',el).checked,user=operator();
  tx(db=>{const nf={id:uid(),ts:Date.now(),supplier:sup,number:num,serie:$('#nfse',el).value,key:$('#nfk',el).value,items:lines.map(l=>({...l})),user,total:r2(lines.reduce((s,l)=>s+l.qty*l.cost,0))};db.nfs.push(nf);
   lines.forEach(l=>{mov(db,l.pid,l.qty,'entrada','NF '+num+' — '+sup,'ESTOQUE',user,{cost:l.cost});if(uc&&l.cost)prod2(db,l.pid).cost=l.cost})});
  closeModal(el);toast(`NF ${esc(num)} lançada: +${lines.reduce((s,l)=>s+l.qty,0)} itens no estoque`,'ok');refresh();
 };
 draw();
}

function receiveFiado(id){
 const o=DB.orders.find(x=>x.id===id);
 needCash(()=>payModal(o.total,{title:`Receber fiado ${o.num} — ${o.customer.name}`,allowFiado:false,onPay:pay=>{
  const user=operator();const r=tx(db=>{const x=db.orders.find(y=>y.id===id);if(!x||x.paid)return null;const cash=db.cash.find(c=>c.status==='aberto');x.paid=true;x.paidTs=Date.now();x.fiadoPaidMethod=pay.method;
   db.payments.push({id:uid(),ts:x.paidTs,orderId:x.id,num:x.num,method:pay.method,amount:x.total,cashId:cash?cash.id:null,kind:'fiado',user});return x});
  if(r){toast(`Fiado ${esc(r.num)} recebido (${ML[pay.method]})`,'ok');refresh()}}}));
}
function orderDetail(id){
 const o=DB.orders.find(x=>x.id===id);if(!o)return;
 const el=modal(`<div class="row" style="margin-bottom:10px"><h2 class="h" style="margin:0">Pedido ${esc(o.num)}</h2>${stPill(o)}<span class="pill ${o.channel==='ONLINE'?'b':'g'}">${o.channel}</span></div>
 ${o.fulfil!=='balcao'?`<p><b>${esc(o.customer.name)}</b> · ${esc(o.customer.phone)}<br>${o.fulfil==='retirada'?`Retirada: ${fdk(o.pickup.date)} às ${o.pickup.time}`:`Entrega: ${esc(o.address)}`}${o.obs?`<br><i>Obs.: ${esc(o.obs)}</i>`:''}${o.deliveredTs?`<br><span class="mut sm">Entregue em ${fdt(o.deliveredTs)} por ${esc(o.deliveredBy)}</span>`:''}</p>`:''}
 ${receiptHTML(o)}
 <div class="foot"><button class="btn" data-p>${I.print} Imprimir</button><a class="btn ok" target="_blank" rel="noopener" href="${waLink(o.customer.phone,receiptText(o))}">${I.wa} WhatsApp</a>${o.status!=='cancelado'?'<button class="btn r" data-c>Cancelar e estornar estoque</button>':''}</div>`);
 el.querySelector('[data-p]').onclick=()=>printHTML(receiptHTML(o));
 const c=el.querySelector('[data-c]');if(c)c.onclick=async()=>{if(await cancelOrder(id))closeModal(el)};
}
async function cancelOrder(id){
 const o=DB.orders.find(x=>x.id===id);
 if(!await confirmBox(`Cancelar o pedido <b>${esc(o.num)}</b>? Os itens voltam para o estoque.${o.paid?`<br><br><b style="color:var(--red)">Este pedido está pago (${ML[o.method]} ${fmt(o.total)}): faça a devolução do valor ao cliente.</b>`:''}`,'Cancelar pedido','r'))return false;
 const user=operator();
 tx(db=>{const x=db.orders.find(y=>y.id===id);if(!x||x.status==='cancelado')return;x.status='cancelado';x.cancelTs=Date.now();x.cancelBy=user;
  x.items.forEach(i=>{if(!i.service&&prod2(db,i.pid))mov(db,i.pid,i.qty,'estorno','Cancelamento '+x.num,x.channel,user)});
  if(x.paid){x.refunded=true;db.payments.push({id:uid(),ts:Date.now(),orderId:x.id,num:x.num,method:x.method,amount:-x.total,cashId:x.channel==='PDV'&&db.cash.find(c=>c.status==='aberto')?db.cash.find(c=>c.status==='aberto').id:null,kind:'estorno',user})}});
 toast(`Pedido ${esc(o.num)} cancelado, estoque estornado`,'ok');refresh();return true;
}

  <div class="sm">${o.fulfil==='retirada'?`${I.clock} Retira <b>${o.pickup.date===today()?'HOJE':fdk(o.pickup.date)} ${o.pickup.time}</b>`:`${I.truck} Entrega · ${esc(o.address)}`}</div>
  ${mode==='sep'?o.items.map((i,k)=>`<label class="sepi ${o.separated[k]?'done':''}"><input type="checkbox" ${o.separated[k]?'checked':''} onchange="sepItem('${o.id}',${k},this.checked)"><span>${i.qty}× ${esc(i.name)} <span class="mut sm">${esc(i.code)}</span></span></label>`).join('')+`<button class="btn ok" ${o.items.every((_,k)=>o.separated[k])?'':'disabled'} onclick="markReady('${o.id}')">${I.check} Pedido separado / pronto</button>`
   :`<div class="sm mut">${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div>`}
  ${mode==='ready'?`<div class="row"><a class="btn s ok" target="_blank" rel="noopener" href="${waLink(o.customer.phone,o.fulfil==='retirada'?`Olá ${o.customer.name}! Seu pedido ${o.num} está PRONTO para retirada na ${DB.settings.store} (${DB.settings.address}). Horário agendado: ${fdk(o.pickup.date)} ${o.pickup.time}.`:`Olá ${o.customer.name}! Seu pedido ${o.num} saiu para entrega.`)}">${I.wa} Avisar cliente</a><button class="btn s y" onclick="deliverOrder('${o.id}')">${o.fulfil==='retirada'?'Confirmar retirada':'Entregue'}</button></div>`:''}
  ${mode==='wait'?`<button class="btn s" onclick="adminConfirmPix('${o.id}')">Confirmar Pix manualmente</button>`:''}</div>`;
 $('#adm').innerHTML=`<p class="mut" style="margin-top:0">Fila de separação dos pedidos online: marque cada item ao pegar na prateleira. Quando tudo estiver separado, avise o cliente pelo WhatsApp.</p>
 <div class="kan"><div class="kcol"><div class="h">Aguardando pagamento (${col1.length})</div>${col1.map(o=>card(o,'wait')).join('')||'<div class="empty sm">—</div>'}</div>
 <div class="kcol" style="background:#fbe9a6"><div class="h">A separar (${col2.length})</div>${col2.map(o=>card(o,'sep')).join('')||'<div class="empty sm">Nada para separar 👍</div>'}</div>
 <div class="kcol" style="background:#cfe6d1"><div class="h">Pronto p/ retirada / entrega (${col3.length})</div>${col3.map(o=>card(o,'ready')).join('')||'<div class="empty sm">—</div>'}</div></div>`;
}
function sepItem(id,k,v){tx(db=>{const o=db.orders.find(x=>x.id===id);if(o)o.separated[k]=v});refresh()}
function markReady(id){tx(db=>{const o=db.orders.find(x=>x.id===id);if(o)o.ready=true});toast('Pedido pronto! Avise o cliente.','ok');refresh()}

/* ----- CAIXA ----- */
function tCaixa(){
 const c=openCash(),r=c&&cashReport(c),hist=DB.cash.filter(x=>x.status==='fechado').sort((a,b)=>b.openTs-a.openTs);
 $('#adm').innerHTML=`<div class="card" style="margin-bottom:14px">${c?`<div class="row"><h3 class="h" style="margin:0">Caixa aberto</h3><span class="pill ok">desde ${fdt(c.openTs)} · ${esc(c.openBy)}</span><span class="sp"></span><button class="btn" onclick="printHTML(cashReportHTML(openCash()))">${I.print} Relatório parcial</button><button class="btn r" onclick="cashModal()">Fechar caixa</button></div>
 <div class="kpis" style="margin:14px 0 0"><div class="kpi y"><div class="l">Total vendido</div><div class="v">${fmt(r.vendido)}</div><div class="sm">${r.sales.length} vendas · ${r.items} itens</div></div>${['dinheiro','pix','debito','credito'].map(k=>`<div class="kpi"><div class="l">${ML[k]}</div><div class="v">${fmt(r.by[k])}</div></div>`).join('')}<div class="kpi"><div class="l">Fiado concedido</div><div class="v">${fmt(r.fiado.reduce((s,o)=>s+o.total,0))}</div></div><div class="kpi g"><div class="l">Dinheiro esperado</div><div class="v">${fmt(r.esperado)}</div></div></div>`
 :`<div class="row"><h3 class="h" style="margin:0">Caixa fechado</h3><span class="sp"></span><button class="btn y lg" onclick="cashModal()">Abrir caixa</button></div><p class="mut">Abra o caixa no início do dia informando o fundo de troco. Todas as vendas do PDV ficam vinculadas a ele.</p>`}</div>
 <h3 class="h">Histórico de caixas</h3><div class="tbl-w"><table class="t"><thead><tr><th>Abertura</th><th>Fechamento</th><th>Operador</th><th class="r-al">Vendido</th><th class="r-al">Dinheiro esperado</th><th class="r-al">Contado</th><th class="r-al">Diferença</th><th></th></tr></thead><tbody>
 ${hist.map(x=>{const rr=cashReport(x),d=r2((x.counted??rr.esperado)-rr.esperado);return `<tr><td>${fdt(x.openTs)}</td><td>${fdt(x.closeTs)}</td><td>${esc(x.openBy)}</td><td class="r-al"><b>${fmt(rr.vendido)}</b></td><td class="r-al">${fmt(rr.esperado)}</td><td class="r-al">${fmt(x.counted)}</td><td class="r-al" style="color:${d<0?'var(--red)':d>0?'var(--ok)':''}">${fmt(d)}</td><td><button class="btn s" onclick="cashView('${x.id}')">${I.print} Relatório</button></td></tr>`}).join('')}
 </tbody></table></div>`;
}
function cashView(id){const c=DB.cash.find(x=>x.id===id);const el=modal(`${cashReportHTML(c)}<div class="foot"><button class="btn y lg" data-p>${I.print} Imprimir / Salvar PDF</button></div>`);el.querySelector('[data-p]').onclick=()=>printHTML(cashReportHTML(c))}

/* ----- CONFIGURAÇÕES ----- */
function settingsModal(){
 const s=DB.settings;
 const el=modal(`<h2 class="h">Configurações</h2>
 <div class="grid2"><div><label class="f">Nome da loja</label><input class="input" id="s1" value="${esc(s.store)}"></div><div><label class="f">WhatsApp da oficina</label><input class="input" id="s2" value="${esc(s.whats)}"></div></div>
 <label class="f">Endereço</label><input class="input" id="s3" value="${esc(s.address)}"><label class="f">Horário</label><input class="input" id="s4" value="${esc(s.hours)}">
 <div class="grid2"><div><label class="f">Chave Pix</label><input class="input" id="s5" value="${esc(s.pix)}"></div><div><label class="f">Antecedência mínima p/ retirada (min)</label><input class="input" id="s8" inputmode="numeric" value="${s.lead}"></div></div>
 <label class="chk"><input type="checkbox" id="s6" ${s.delivery?'checked':''}> Oferecer entrega na loja online</label><label class="f">Taxa de entrega (R$)</label><input class="input" id="s7" inputmode="decimal" value="${m2s(s.fee)}">
 <label class="f">Vendedores / operadores (separados por vírgula)</label><input class="input" id="s9" value="${esc(s.users.join(', '))}">
 <div class="foot"><button class="btn r" data-reset>Restaurar dados de exemplo</button><button class="btn" data-bk>${I.down} Backup (JSON)</button><label class="btn" style="cursor:pointer">Restaurar backup<input type="file" accept=".json" hidden id="rbk"></label><span class="sp"></span><button class="btn y lg" data-ok>Salvar</button></div>`);
 el.querySelector('[data-ok]').onclick=()=>{tx(db=>Object.assign(db.settings,{store:$('#s1',el).value||'Bancada',whats:$('#s2',el).value,address:$('#s3',el).value,hours:$('#s4',el).value,pix:$('#s5',el).value,delivery:$('#s6',el).checked,fee:parseMoney($('#s7',el).value),lead:parseInt($('#s8',el).value)||0,users:$('#s9',el).value.split(',').map(x=>x.trim()).filter(Boolean)}));if(!DB.settings.users.length)tx(db=>db.settings.users=['Balcão']);closeModal(el);toast('Configurações salvas','ok');refresh()};
 el.querySelector('[data-bk]').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='bancada-backup-'+today()+'.json';a.click()};
 $('#rbk',el).onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.v!==1||!d.products)throw 0;if(!await confirmBox('Substituir todos os dados atuais pelo backup?','Restaurar','r'))return;DB=d;save();closeModal(el);toast('Backup restaurado','ok');refresh()}catch(err){toast('Arquivo de backup inválido','err')}};
 el.querySelector('[data-reset]').onclick=async()=>{if(!await confirmBox('Apagar TODOS os dados e recriar os dados de exemplo?','Apagar e recriar','r'))return;DB=seed();save();localStorage.removeItem(PCART);localStorage.removeItem(SCART);localStorage.removeItem(MYORD);pcart={items:[],disc:{type:'R$',v:0},sel:null};shopCart=[];closeModal(el);toast('Dados de exemplo recriados','ok');refresh()};
}

/* =====================================================================
   SINCRONIZAÇÃO ENTRE ABAS (loja ↔ PDV ↔ painel no mesmo computador)
   ===================================================================== */
window.addEventListener('storage',e=>{
 if(e.key===KEY){
  const before=new Set(DB.orders.map(o=>o.id));const d=rawLoad();if(!d||d.v!==1)return;DB=d;
  const novos=DB.orders.filter(o=>!before.has(o.id)&&o.channel==='ONLINE');
  if(novos.length&&MODE!=='loja'){beep(true);setTimeout(()=>beep(true),160);toast(`${I.store} Novo pedido online ${esc(novos[0].num)} — ${esc(novos[0].customer.name)}`,'y')}
  if(!modals.length||MODE==='pdv')refresh();
  modals.forEach(m=>m.el._draw&&m.el._draw());
 }else if(e.key===PCART&&MODE==='pdv'){pcart=lsGet(PCART,pcart);pdvCart()}
 else if(e.key===SCART){shopCart=lsGet(SCART,[]);saveShop();drawCart()}
});

load();
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
